[project]
name = "hontology"
version = "0.1.0"
description = "Define an ontology, detect it in a live news feed, and evaluate the result honestly."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "emaroppo" }]

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Storage
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    # Analytics / tabular
    "polars>=1.17",
    "duckdb>=1.1",
    # Ingest
    "httpx>=0.28",
    "trafilatura>=2.0",
    "tenacity>=9.0",
    "pycountry>=24.6",
    "readability-lxml>=0.8.1",
    "beautifulsoup4>=4.12",
    # CLI
    "typer>=0.15",
]

[project.optional-dependencies]
ui = ["streamlit>=1.41"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
hontology = "hontology.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hontology"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a parameter default is the FastAPI idiom, not the B008 bug.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    # Same story for Typer: a call in the default is the framework's idiom.
    "typer.Argument",
    "typer.Option",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need a live Postgres are marked; the default run skips nothing but
# CI selects with `-m "not requires_db"` when no service container is available.
markers = [
    "requires_db: needs a live Postgres with pgvector",
    "requires_llm: needs a reachable LLM provider",
]

[tool.mypy]
python_version = "3.12"
packages = ["hontology"]
ignore_missing_imports = true
